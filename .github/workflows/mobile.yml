name: Phone app

on:
  push:
    paths:
      - "mobile/**"
      - "backend/app/**"
      - "backend/tools/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/app/**"
      - "backend/tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Phone app (analyze, sync round trip with the PC, APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: backend/environment.yml
          cache-environment: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite for the tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - name: Platform folders
        working-directory: mobile
        run: |
          flutter --version
          flutter create --org io.github.mrblizo --project-name pfi --platforms android,ios .
          rm -f test/widget_test.dart
          # Android lint crashes on some third-party plugin sources
          # (url_launcher_android); our own code is checked by flutter analyze.
          if ! grep -q "lintVital" android/build.gradle.kts; then
            printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> android/build.gradle.kts
          fi
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: PC writes a sync folder (demo data)
        run: python backend/tools/sync_fixture.py make "$RUNNER_TEMP/fx"
      - name: Tests (phone reads the PC's folder and writes back)
        working-directory: mobile
        env:
          PFI_SYNC_FIXTURE: ${{ runner.temp }}/fx
        run: flutter test
      - name: PC reads the phone's changes
        run: python backend/tools/sync_fixture.py verify "$RUNNER_TEMP/fx"
      - name: Build APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=ONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }}
          --dart-define=DROPBOX_APP_KEY=${{ vars.DROPBOX_APP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: pfi-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Platform folders as generated
        if: always()
        run: tar czf "$RUNNER_TEMP/platforms.tgz" --exclude=build --exclude=.gradle -C mobile android ios .metadata 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-folders
          path: ${{ runner.temp }}/platforms.tgz
