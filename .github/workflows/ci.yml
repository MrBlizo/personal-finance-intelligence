name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: backend/environment.yml
          cache-environment: true
      - name: Lint
        working-directory: backend
        run: flake8 --max-line-length 79 --extend-ignore E203 app tests
      - name: Tests
        working-directory: backend
        env:
          PFI_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Screens (type check and build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
