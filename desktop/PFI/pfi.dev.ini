; Development configuration, copied next to the Debug PFI.exe on build.
; Runs the backend from source with the conda environment and your
; installed PostgreSQL 18 programs. Paths are relative to PFI.exe
; (desktop\x64\Debug\PFI\). Delete this pfi.ini to use the installed layout.
[Backend]
Exe=%USERPROFILE%\miniconda3\envs\pfi\python.exe
Args=run.py
WorkDir=..\..\..\..\backend
PgBin=C:\Program Files\PostgreSQL\18\bin
WebDir=..\..\..\..\frontend\out
DataDir=..\..\..\..\backend\.devdata
