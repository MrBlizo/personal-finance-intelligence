name: pfi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - fastapi>=0.115
  - uvicorn>=0.30
  - sqlalchemy>=2.0.30
  - pydantic>=2.7
  - pydantic-settings>=2.3
  - python-multipart>=0.0.9
  - pandas>=2.2
  - numpy>=1.26
  # OpenBLAS instead of Intel MKL: much smaller app bundle, and PyInstaller
  # resolves its DLLs reliably.
  - libblas=*=*openblas
  - plotly>=6.0
  # reports: PDF (reportlab) and Excel export (openpyxl)
  - reportlab>=4.2
  - openpyxl>=3.1
  # encrypted backups (AES-GCM, scrypt)
  - cryptography>=42
  # build & test
  - pyinstaller>=6.6
  - pytest>=8
  - httpx>=0.27
  - flake8>=7
