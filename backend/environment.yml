name: pfi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - fastapi>=0.115
  - uvicorn>=0.30
  - sqlalchemy>=2.0.30
  - pydantic>=2.7
  - pydantic-settings>=2.3
  - python-multipart>=0.0.9
  - pandas>=2.2
  - numpy>=1.26
  # OpenBLAS instead of Intel MKL: much smaller app bundle, and PyInstaller
  # resolves its DLLs reliably.
  - libblas=*=*openblas
  - plotly>=6.0
  # reports: PDF (reportlab) and Excel export (openpyxl)
  - reportlab>=4.2
  - openpyxl>=3.1
  # encrypted backups (AES-GCM, scrypt)
  - cryptography>=42
  # build & test
  - pyinstaller>=6.6
  - pytest>=8
  - httpx>=0.27
  - flake8>=7
  - pip
  - pip:
      # Receipt scanning: Windows' built-in offline text recognition
      # (Windows.Media.Ocr) through PyWinRT. Not on conda-forge; Windows only.
      - winrt-runtime>=4.2,<5; sys_platform == 'win32'
      - winrt-Windows.Foundation>=4!10.0.28000; sys_platform == 'win32'
      - winrt-Windows.Foundation.Collections>=4!10.0.28000; sys_platform == 'win32'
      - winrt-Windows.Globalization>=4!10.0.28000; sys_platform == 'win32'
      - winrt-Windows.Graphics.Imaging>=4!10.0.28000; sys_platform == 'win32'
      - winrt-Windows.Media.Ocr>=4!10.0.28000; sys_platform == 'win32'
      - winrt-Windows.Storage.Streams>=4!10.0.28000; sys_platform == 'win32'
