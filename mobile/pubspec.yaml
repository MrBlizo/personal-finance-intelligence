name: pfi
description: Personal Finance for Android and iOS, in sync with Personal Finance on Windows.
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  file_picker: ">=8.0.0 <11.0.0"
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ^4.0.0
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"
  google_sign_in: ^7.2.0
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  timezone: ">=0.9.4 <1.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "assets/branding/icon-background.png"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon-monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/db/schema.sql
    - assets/db/schema.json
    - assets/branding/icon.png
